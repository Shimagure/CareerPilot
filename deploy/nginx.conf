# CareerPilot — generic single-host reverse proxy (P5.1)
# ======================================================
# Topology: browser -> this proxy (TLS) -> static frontend + /api/* -> uvicorn
#
#       https://<public-origin>
#              │  nginx (this file)
#              ├── /     → frontend/dist  (SPA fallback to index.html)
#              └── /api/ → http://127.0.0.1:8000  (single-worker uvicorn)
#
# This file is deliberately GENERIC:
#   * No personal/hard-coded domain — set `server_name` to your origin.
#   * No embedded certificates — TLS certificates are operator-provided.
#   * The backend listens only on the loopback interface (see deploy/README.md),
#     so /api/* is reachable through this proxy and nowhere else.
#   * The application itself still enforces authentication: private /api/*
#     routes return 401 without a JWT, and admin routes require an admin JWT.
#     Nothing in this proxy bypasses application auth.
#
# Install: place under /etc/nginx/conf.d/, edit the placeholder paths, then
# `nginx -t` and reload. This checkpoint does NOT install or start nginx.

# Proxy-level bound for anonymous public demo reads (defense-in-depth behind the
# in-app "public.read" limit; see deploy/README.md §9). 10MB holds ~160k IPs.
limit_req_zone $binary_remote_addr zone=careerpilot_public:10m rate=120r/m;

# -- HTTP (non-TLS) ----------------------------------------------------------
# Simple/cleartext base block. For production, terminate TLS in the 443 block
# below (or a platform load balancer) and redirect HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;   # ← set to your public hostname

    # ---- API plane: forward to single-worker uvicorn on loopback -----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }

    # ---- Anonymous public demo reads: extra proxy-level bound ---------------
    # More specific location than /api/; repeats the same forwarding rules.
    # The in-app "public.read" limiter remains the authoritative control; this
    # zone adds burst protection for anonymous crawlers.
    # Note: RATE_LIMIT_TRUST_PROXY=true requires this proxy to set
    # X-Forwarded-For, which it does above.
    location /api/public/ {
        limit_req zone=careerpilot_public burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ---- Static React/Vite frontend with SPA fallback -----------------------
    # Build output: frontend/dist -> copy to the root below. BrowserRouter deep
    # links (/demo, /demo/jobs/:stableId, ...) fall back to index.html so they
    # load on direct navigation/refresh. /api/* never reaches this block
    # (handled by the two locations above), so API requests are never rewritten
    # to index.html.
    root /var/www/careerpilot/frontend-dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # SPA assets are content-hashed; cache aggressively but revalidate.
        location ~* \.(js|css|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # Never serve backend private filesystem paths through the web root.
    location ~ /\. { deny all; }
}

